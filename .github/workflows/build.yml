name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KS_B64: ${{ secrets.REMOTEAI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/remoteai.jks"
            echo "REMOTEAI_KEYSTORE=$RUNNER_TEMP/remoteai.jks" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          REMOTEAI_KEYSTORE_PASSWORD: ${{ secrets.REMOTEAI_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Publish APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RemoteAI.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest RemoteAI.apk --title "RemoteAI build ${{ github.run_number }}" --notes "Commit ${{ github.sha }}" --latest
